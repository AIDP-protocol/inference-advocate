# cheapai.win TLS: apex static holding page; api reverse-proxies the mock on :8822.
# Same SSE-safe proxy rules as api.honestmodel.win.
# Placeholders filled by deploy/setup-airp-sites.sh.

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName cheapai.win
	DocumentRoot @AIRP_SITES_ROOT@/cheapai.win

	ErrorLog ${APACHE_LOG_DIR}/cheapai.win-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/cheapai.win-ssl-access.log combined

	<Directory @AIRP_SITES_ROOT@/cheapai.win>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/cheapai.win/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/cheapai.win/privkey.pem
</VirtualHost>

<VirtualHost *:443>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName api.cheapai.win
	Protocols http/1.1

	ErrorLog ${APACHE_LOG_DIR}/api.cheapai.win-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/api.cheapai.win-ssl-access.log combined

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyPass / http://127.0.0.1:8822/ flushpackets=on
	ProxyPassReverse / http://127.0.0.1:8822/

	SetEnv no-gzip 1
	SetEnv no-brotli 1
	SetEnv proxy-sendchunked 1
	RemoveOutputFilter DEFLATE
	Header always set Cache-Control "no-store"
	Header always unset Content-Encoding

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/cheapai.win/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/cheapai.win/privkey.pem
</VirtualHost>
</IfModule>
