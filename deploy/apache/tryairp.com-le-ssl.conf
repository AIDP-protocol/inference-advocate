# tryairp.com TLS: public advocate demo. Daemon stays on 127.0.0.1:8790.
# Placeholders filled by deploy/setup-airp-sites.sh from deploy/local.env.

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName tryairp.com
	ServerAlias tryaidp.com dev.tryaidp.com
	DocumentRoot @AIRP_SITES_ROOT@/tryairp.com

	ErrorLog ${APACHE_LOG_DIR}/tryairp.com-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/tryairp.com-ssl-access.log combined

	<Directory @AIRP_SITES_ROOT@/tryairp.com>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyPass / http://127.0.0.1:8790/
	ProxyPassReverse / http://127.0.0.1:8790/

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/tryairp.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/tryairp.com/privkey.pem
</VirtualHost>
</IfModule>
