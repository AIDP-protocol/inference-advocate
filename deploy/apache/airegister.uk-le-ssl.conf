# airegister.uk TLS. Placeholders filled by deploy/setup-airp-sites.sh.

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName airegister.uk
	ServerAlias www.airegister.uk
	DocumentRoot @AIRP_SITES_ROOT@/airegister.uk

	ErrorLog ${APACHE_LOG_DIR}/airegister.uk-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/airegister.uk-ssl-access.log combined

	<Directory @AIRP_SITES_ROOT@/airegister.uk>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	Alias /airp/register.json @AIRP_REPO_ROOT@/data/register/serving-register.json
	Alias /airp/register.json.sig @AIRP_REPO_ROOT@/data/register/serving-register.sig
	# Negative fixture: valid registrar signature, substituted keys on honestmodel.win.entry.
	# Load with AIRP_REGISTER_DOCUMENT to demo key_set_digest_mismatch. Spec §4.8.
	Alias /airp/register.substituted-keys.json @AIRP_REPO_ROOT@/data/register/serving-register.substituted-keys.json
	Alias /airp/register.substituted-keys.json.sig @AIRP_REPO_ROOT@/data/register/serving-register.substituted-keys.sig

	<Directory @AIRP_REPO_ROOT@/data/register>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# Exact octets for the register document and its detached signature.
	# No mod_deflate, no rewriting of body bytes. Spec signature is over the file.
	<Location /airp/register.json>
		Header set Content-Type "application/json"
		Header set Access-Control-Allow-Origin "*"
		Header always unset Content-Encoding
		SetEnv no-gzip 1
		SetEnv no-brotli 1
		RemoveOutputFilter DEFLATE
	</Location>
	<Location /airp/register.json.sig>
		Header set Content-Type "text/plain"
		Header set Access-Control-Allow-Origin "*"
		Header always unset Content-Encoding
		SetEnv no-gzip 1
		SetEnv no-brotli 1
		RemoveOutputFilter DEFLATE
	</Location>
	<Location /airp/register.substituted-keys.json>
		Header set Content-Type "application/json"
		Header set Access-Control-Allow-Origin "*"
		Header always unset Content-Encoding
		SetEnv no-gzip 1
		SetEnv no-brotli 1
		RemoveOutputFilter DEFLATE
	</Location>
	<Location /airp/register.substituted-keys.json.sig>
		Header set Content-Type "text/plain"
		Header set Access-Control-Allow-Origin "*"
		Header always unset Content-Encoding
		SetEnv no-gzip 1
		SetEnv no-brotli 1
		RemoveOutputFilter DEFLATE
	</Location>

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/airegister.uk/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/airegister.uk/privkey.pem
</VirtualHost>
</IfModule>
