# cheapai.win apex holding page + api reverse proxy (HTTP).
# Placeholders filled by deploy/setup-airp-sites.sh.

<VirtualHost *:80>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName cheapai.win
	DocumentRoot @AIRP_SITES_ROOT@/cheapai.win

	ErrorLog ${APACHE_LOG_DIR}/cheapai.win-error.log
	CustomLog ${APACHE_LOG_DIR}/cheapai.win-access.log combined

	<Directory @AIRP_SITES_ROOT@/cheapai.win>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	RewriteEngine on
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteCond %{HTTPS} !=on
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:80>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName api.cheapai.win
	DocumentRoot @AIRP_SITES_ROOT@/cheapai.win

	ErrorLog ${APACHE_LOG_DIR}/api.cheapai.win-error.log
	CustomLog ${APACHE_LOG_DIR}/api.cheapai.win-access.log combined

	<Directory @AIRP_SITES_ROOT@/cheapai.win>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	RewriteEngine on
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteCond %{HTTPS} !=on
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
