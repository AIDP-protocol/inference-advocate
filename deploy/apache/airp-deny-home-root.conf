# Deny DocumentRoot/Alias aimed at the sites root or an extra host root (for
# example the real path behind a sites symlink). A mis-aimed root would expose
# credentials and keys under that directory. Leaf site directories and the
# register Alias still get their own Require all granted.
#
# Placeholders are filled by deploy/setup-airp-sites.sh from deploy/local.env.

<DirectoryMatch "^(@AIRP_DENY_ROOTS@)$">
	Require all denied
</DirectoryMatch>
