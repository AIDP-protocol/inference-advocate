name: ci

# Builds the core, runs the test suite, and runs the demo end to end on every push.
#
# The demo is in here on purpose rather than only the unit tests. The claim this repository
# makes is that one scripted scenario executes the paper's argument, and a claim like that
# should break the build when it stops being true.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor, because node:sqlite arrived there. 24 is what the author runs.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: demo end to end
        run: npm run demo

      - name: build the interface
        run: npm run build:ui
