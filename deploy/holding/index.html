<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIRP demo provider</title>
    <style>
      :root {
        --ink: #1a1d24;
        --muted: #5a6270;
        --paper: #f3f0e8;
        --line: #c8c2b4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #fff8e8 0%, transparent 55%),
          radial-gradient(900px 500px at 110% 20%, #e7eef7 0%, transparent 50%),
          var(--paper);
        color: var(--ink);
      }
      main {
        width: min(36rem, calc(100% - 2.5rem));
        padding: 2.5rem 0;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        font-size: 1.05rem;
      }
      .rule {
        height: 1px;
        background: var(--line);
        margin: 1.4rem 0;
      }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="host">provider</h1>
      <div class="rule"></div>
      <p>
        Holding page for an AIRP demo provider identity domain.
        Sealed inference is served at <code id="api">api.&lt;host&gt;/v1</code>.
      </p>
    </main>
    <script>
      const host = location.hostname.replace(/^www\./, '');
      document.getElementById('host').textContent = host;
      document.title = host;
      document.getElementById('api').textContent = 'api.' + host + '/v1';
    </script>
  </body>
</html>
