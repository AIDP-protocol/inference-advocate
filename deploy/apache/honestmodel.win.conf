# honestmodel.win apex holding page + api reverse proxy (HTTP).
# Placeholders filled by deploy/setup-airp-sites.sh.

<VirtualHost *:80>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName honestmodel.win
	DocumentRoot @AIRP_SITES_ROOT@/honestmodel.win

	ErrorLog ${APACHE_LOG_DIR}/honestmodel.win-error.log
	CustomLog ${APACHE_LOG_DIR}/honestmodel.win-access.log combined

	<Directory @AIRP_SITES_ROOT@/honestmodel.win>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	RewriteEngine on
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteCond %{HTTPS} !=on
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:80>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName api.honestmodel.win
	# Same leaf as the apex so HTTP-01 challenges for api.* resolve under webroot.
	DocumentRoot @AIRP_SITES_ROOT@/honestmodel.win

	ErrorLog ${APACHE_LOG_DIR}/api.honestmodel.win-error.log
	CustomLog ${APACHE_LOG_DIR}/api.honestmodel.win-access.log combined

	<Directory @AIRP_SITES_ROOT@/honestmodel.win>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	RewriteEngine on
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteCond %{HTTPS} !=on
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
