# honestmodel.win TLS: apex static holding page; api reverse-proxies the mock on :8821.
# Sealed streams must not be buffered, compressed, or re-chunked. A proxy that alters
# bytes presents as a signature mismatch, not a proxy problem.
# Placeholders filled by deploy/setup-airp-sites.sh.

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName honestmodel.win
	DocumentRoot @AIRP_SITES_ROOT@/honestmodel.win

	ErrorLog ${APACHE_LOG_DIR}/honestmodel.win-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/honestmodel.win-ssl-access.log combined

	<Directory @AIRP_SITES_ROOT@/honestmodel.win>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/honestmodel.win/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/honestmodel.win/privkey.pem
</VirtualHost>

<VirtualHost *:443>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName api.honestmodel.win
	Protocols http/1.1

	ErrorLog ${APACHE_LOG_DIR}/api.honestmodel.win-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/api.honestmodel.win-ssl-access.log combined

	ProxyRequests Off
	ProxyPreserveHost On
	# flushpackets keeps SSE deltas moving; buffering breaks terminal-seal verification.
	ProxyPass / http://127.0.0.1:8821/ flushpackets=on
	ProxyPassReverse / http://127.0.0.1:8821/

	# Never compress proxied sealed responses. Never set Content-Encoding here.
	SetEnv no-gzip 1
	SetEnv no-brotli 1
	SetEnv proxy-sendchunked 1
	RemoveOutputFilter DEFLATE
	Header always set Cache-Control "no-store"
	Header always unset Content-Encoding

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/honestmodel.win/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/honestmodel.win/privkey.pem
</VirtualHost>
</IfModule>
