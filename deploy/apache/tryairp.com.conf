# tryairp.com: public Inference Advocate demo (UI + API via the local daemon).
# Placeholders filled by deploy/setup-airp-sites.sh from deploy/local.env.
# Legacy tryaidp.com / dev.tryaidp.com remain as aliases during the rename.

<VirtualHost *:80>
	ServerAdmin @AIRP_SERVER_ADMIN@
	ServerName tryairp.com
	ServerAlias tryaidp.com dev.tryaidp.com
	DocumentRoot @AIRP_SITES_ROOT@/tryairp.com

	ErrorLog ${APACHE_LOG_DIR}/tryairp.com-error.log
	CustomLog ${APACHE_LOG_DIR}/tryairp.com-access.log combined

	<Directory @AIRP_SITES_ROOT@/tryairp.com>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# ACME HTTP-01 must not be swallowed by the daemon proxy.
	ProxyPass /.well-known/acme-challenge/ !
	ProxyPreserveHost On
	# flushpackets: ingress arrival frames are small NDJSON writes; buffering them
	# empties the receive sight glass until the response completes.
	ProxyPass / http://127.0.0.1:8790/ flushpackets=on
	ProxyPassReverse / http://127.0.0.1:8790/

	SetEnv no-gzip 1
	SetEnv no-brotli 1
	SetEnv proxy-sendchunked 1
	RemoveOutputFilter DEFLATE

	RewriteEngine on
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteCond %{HTTPS} !=on
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
